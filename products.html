<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valsando - Productos</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="header">
  <div class="container header-container">
    <a href="index.html" class="logo" aria-label="Valsando">Valsando</a>
    <nav class="nav-menu" role="navigation" aria-label="Menú principal">
      <ul class="nav-list">
        <li><a href="index.html" class="nav-link">Inicio</a></li>
        <li><a href="products.html" class="nav-link active">Productos</a></li>
        <li><a href="contact.html" class="nav-link">Contacto</a></li>
      </ul>
    </nav>
    <button id="cart-btn" class="cart-button" aria-label="Carrito de compras">
      🛒 <span id="cart-count" class="cart-count">0</span>
    </button>
  </div>
</header>

<main class="productos-section">
  <div class="container">

    <div class="filters-bar">
      <input type="text" id="searchInput" placeholder="Buscar productos..." aria-label="Buscar productos" />
      <select id="filterType" aria-label="Filtrar por tipo">
        <option value="">Todos los tipos</option>
        <option value="Electrónico">Electrónico</option>
        <option value="Accesorio">Accesorio</option>
      </select>
      <select id="filterAvailability" aria-label="Filtrar por disponibilidad">
        <option value="">Todos</option>
        <option value="true">Disponible</option>
        <option value="false">No disponible</option>
      </select>
      <select id="filterPrice" aria-label="Filtrar por precio">
        <option value="">Todos los precios</option>
        <option value="low">Menor a $50</option>
        <option value="medium">$50 a $100</option>
        <option value="high">Mayor a $100</option>
      </select>
    </div>

    <div id="product-list" class="product-list" aria-live="polite" aria-label="Listado de productos"></div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <p>© 2025 Valsando. Todos los derechos reservados.</p>
  </div>
</footer>

<script src="js/cart.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
<script src="js/navbar.js"></script>

</body>
</html>
