<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Detalle Producto</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header> 
  <!-- Reusar mismo navbar que en otras páginas -->
</header>

<main class="product-detail-section">
  <div class="container">
    <button onclick="history.back()" class="back-btn" aria-label="Volver atrás">← Volver</button>
    <div class="product-detail">
      <div class="product-images">
        <img id="product-main-image" src="" alt="Imagen producto" />
      </div>
      <div class="product-info">
        <h1 id="product-name"></h1>
        <p id="product-description"></p>
        <div class="price-qty">
          <span class="price" id="product-price"></span>
          <label for="quantity">Cantidad:</label>
          <input type="number" id="quantity" value="1" min="1" />
        </div>
        <button id="add-to-cart-btn" class="add-cart-btn">Agregar al carrito</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <!-- footer igual a otras páginas -->
</footer>

<script src="js/cart-sidebar.js"></script>
<script src="js/product.js"></script>

</body>
</html>
